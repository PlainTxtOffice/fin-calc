name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows tests and checks
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: pwsh
        working-directory: platform/windows
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -e ".[dev]"
      - name: Lint
        run: .venv/Scripts/python.exe -m ruff check .
      - name: Type check
        run: .venv/Scripts/python.exe -m mypy fin_calc
      - name: Test
        run: .venv/Scripts/python.exe -m pytest

  android:
    name: Android tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: platform/android
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;36.0.0"
      - name: Test, lint, and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --console=plain

  ios:
    name: iOS simulator tests
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.4.1.app/Contents/Developer
          xcodebuild -version
          sudo xcodebuild -runFirstLaunch
      - name: Prepare iOS simulator runtime
        timeout-minutes: 15
        run: |
          xcrun simctl list runtimes
          if xcrun simctl list runtimes --json | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["runtimes"]
          sys.exit(0 if any(
              runtime["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")
              and runtime.get("version") == "26.4.1"
              and runtime.get("isAvailable") is True
              for runtime in runtimes) else 1)
          '; then
            echo "iOS 26.4.1 runtime is already installed"
          else
            xcodebuild -downloadPlatform iOS -buildVersion 26.4.1 -architectureVariant arm64
          fi
          xcrun simctl list runtimes --json > "$RUNNER_TEMP/ios-runtimes.json"
          cat "$RUNNER_TEMP/ios-runtimes.json"
      - name: Create and boot an iPhone simulator
        timeout-minutes: 5
        run: |
          runtime_id=$(python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["runtimes"]
          matches = [runtime["identifier"] for runtime in runtimes
                     if runtime["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-")
                     and runtime.get("version") == "26.4.1"
                     and runtime.get("isAvailable") is True]
          if not matches:
              sys.exit("iOS 26.4.1 runtime is unavailable after installation; inspect the runtime list above")
          print(matches[0])
          ' < "$RUNNER_TEMP/ios-runtimes.json")
          simulator_id=$(xcrun simctl create "Fin Calc CI" \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17 "$runtime_id")
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          echo "Created iPhone simulator: $simulator_id ($runtime_id)"
          xcodebuild -showdestinations \
            -project platform/ios/FinCalc.xcodeproj \
            -scheme FinCalc
      - name: Build and test
        run: |
          xcodebuild test \
            -project platform/ios/FinCalc.xcodeproj \
            -scheme FinCalc \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
