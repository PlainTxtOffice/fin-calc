name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows tests and checks
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: pwsh
        working-directory: platform/windows
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -e ".[dev]"
      - name: Lint
        run: .venv/Scripts/python.exe -m ruff check .
      - name: Type check
        run: .venv/Scripts/python.exe -m mypy fin_calc
      - name: Test
        run: .venv/Scripts/python.exe -m pytest

  android:
    name: Android tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: platform/android
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;36.0.0"
      - name: Test, lint, and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --console=plain

  ios:
    name: iOS simulator tests
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.4.1.app/Contents/Developer
          xcodebuild -version
      - name: Select a compatible iPhone simulator
        run: |
          xcodebuild -showdestinations \
            -project platform/ios/FinCalc.xcodeproj \
            -scheme FinCalc | tee "$RUNNER_TEMP/ios-destinations.txt"
          simulator_id=$(python3 -c '
          import re, sys
          text = sys.stdin.read()
          available = text.partition("Available destinations for")[2]
          available = available.partition("Ineligible destinations for")[0]
          for line in available.splitlines():
              if not re.search(r"platform:\s*iOS Simulator\s*,", line):
                  continue
              if not re.search(r"name:\s*iPhone", line):
                  continue
              match = re.search(r"\bid:\s*([0-9A-Fa-f-]{36})\s*,", line)
              if match:
                  print(match.group(1))
                  break
          else:
              sys.exit("No compatible iPhone simulator for FinCalc; check the deployment target and installed runtimes")
          ' < "$RUNNER_TEMP/ios-destinations.txt")
          echo "Selected iPhone simulator: $simulator_id"
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
      - name: Build and test
        run: |
          xcodebuild test \
            -project platform/ios/FinCalc.xcodeproj \
            -scheme FinCalc \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
